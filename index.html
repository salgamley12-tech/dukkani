<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142b4a">
  <meta name="description" content="دكّاني — إدارة المبيعات والمخزون والديون والمصروفات">
  <title>دكّاني | إدارة المحل</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="ui-fixes.css">
  <link rel="stylesheet" href="menu.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="القائمة الجانبية">
      <a class="brand" href="#dashboard" aria-label="دكّاني، الرئيسية"><span class="brand-mark">د</span><span><strong id="brand-name">دكّاني</strong><small>إدارة المحل ببساطة</small></span></a>
      <p class="nav-caption">القائمة الرئيسية</p>
      <nav class="main-nav" aria-label="القائمة الرئيسية">
        <button class="nav-link active" data-view="dashboard"><span>▦</span>الرئيسية</button>
        <button class="nav-link" data-view="sales"><span>↗</span>المبيعات</button>
        <button class="nav-link" data-view="inventory"><span>▤</span>المنتجات والمخزون</button>
        <button class="nav-link" data-view="customers"><span>♙</span>الزبائن والديون</button>
        <button class="nav-link" data-view="purchases"><span>↙</span>المشتريات</button>
        <button class="nav-link" data-view="expenses"><span>−</span>المصروفات</button>
        <button class="nav-link" data-view="reports"><span>▥</span>التقارير</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="local-badge"><span class="live-dot"></span><span><strong>حفظ محلي</strong><small>على هذا الجهاز فقط</small></span></div>
        <button class="nav-link settings-link" data-view="settings"><span>⚙</span>الإعدادات والنسخ الاحتياطي</button>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" type="button" aria-label="فتح القائمة" aria-expanded="false" aria-controls="sidebar">☰</button>
        <div class="topbar-title"><span id="topbar-shop-name">دكّاني</span><span class="topbar-divider">/</span><strong id="page-title">الرئيسية</strong></div>
        <div class="top-actions"><span class="today-chip" id="today-label"></span><button class="icon-action" id="quick-sale" type="button" title="تسجيل بيع" aria-label="تسجيل بيع">＋<span>بيع سريع</span></button></div>
      </header>
      <div class="content" id="app-content"></div>
      <footer class="app-footer"><span>دكّاني</span> · بياناتك محفوظة محليًا في هذا المتصفح</footer>
    </main>
  </div>
  <button class="mobile-scrim" id="mobile-scrim" type="button" aria-label="إغلاق القائمة" hidden></button>
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head"><div><p class="eyebrow" id="modal-eyebrow">إدارة المحل</p><h2 id="modal-title"></h2></div><button class="icon-button" type="button" data-close-modal aria-label="إغلاق">×</button></div>
      <div id="modal-body"></div>
    </section>
  </div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
  <script src="ui-fixes.js" defer></script>
</body>
</html>
